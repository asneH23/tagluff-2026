<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#080918"/>
  <title>Tågluff 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    :root{
      --bg:#080918;--s1:rgba(255,255,255,0.04);--s2:rgba(255,255,255,0.08);
      --b1:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.14);
      --t1:#F0F0FF;--t2:#7A7B9A;--t3:#3E3F5E;
      --gold:#D4A853;--gold-hi:#F0CC78;--gold-lo:#9A6E28;
      --gold-dim:rgba(212,168,83,0.10);--green:#4ADE80;--red:#F87171;
      --r:14px;--r-sm:9px;
      --font:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;
      --safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,0px);
      --nav-h:calc(62px + var(--safe-b));
    }
    html,body{height:100%;width:100%;font-family:var(--font);background:var(--bg);color:var(--t1);overflow:hidden;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(212,168,83,0.14) 0%,transparent 65%);top:-140px;right:-120px;pointer-events:none;z-index:0;animation:orbA 14s ease-in-out infinite}
    body::after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.12) 0%,transparent 65%);bottom:80px;left:-80px;pointer-events:none;z-index:0;animation:orbB 18s ease-in-out infinite}
    @keyframes orbA{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(30px) scale(1.08)}}
    @keyframes orbB{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-24px) scale(1.06)}}
    #app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;z-index:1}
    .screen{display:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + 20px)}
    .screen.active{display:block;animation:fadeUp .28s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .topbar{padding:calc(var(--safe-t) + 14px) 20px 14px;background:rgba(8,9,24,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--b1)}
    .topbar-row{display:flex;align-items:center;justify-content:space-between}
    .topbar h1{font-size:16px;font-weight:600;color:var(--t1);letter-spacing:-0.1px}
    .topbar-right{display:flex;align-items:center;gap:10px}
    .cd-badge{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:-0.3px}
    .sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--t3);padding:4px 9px;border-radius:20px;border:1px solid var(--b1);background:var(--s1)}
    .sync-dot{width:5px;height:5px;border-radius:50%;background:var(--t3);transition:background .3s}
    .sync-pill.online .sync-dot{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.5)}
    .sync-pill.offline .sync-dot{background:var(--red)}
    .sync-pill.syncing .sync-dot{background:var(--gold);animation:pulse 1s ease-in-out infinite}
    .sync-pill.online{color:#6EE7A0}.sync-pill.offline{color:var(--red)}.sync-pill.syncing{color:var(--gold)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(6,7,18,0.90);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--b1);display:flex;padding:8px 0 calc(8px + var(--safe-b));z-index:100}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;background:none;border:none;cursor:pointer;transition:opacity .12s}
    .nav-btn:active{opacity:.5}
    .nav-icon{width:44px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s}
    .nav-btn.active .nav-icon{background:var(--gold-dim)}
    .nav-btn svg{stroke:var(--t3);transition:stroke .2s}
    .nav-btn.active svg{stroke:var(--gold)}
    .nav-lbl{font-size:10px;font-weight:500;color:var(--t3);font-family:var(--font);transition:color .2s;letter-spacing:.2px}
    .nav-btn.active .nav-lbl{color:var(--gold)}
    .fab{position:fixed;bottom:calc(var(--nav-h) + 16px);right:max(16px,calc((100vw - 430px)/2 + 16px));width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold));border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(212,168,83,.35);z-index:90;transition:transform .12s}
    .fab:active{transform:scale(.9)}
    .fab svg{stroke:#080918}
    .sec{margin:24px 20px 10px;display:flex;align-items:center;gap:12px}
    .sec-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1.4px;white-space:nowrap}
    .sec-line{flex:1;height:1px;background:var(--b1)}

    /* CITY CARDS */
    .city-card{display:flex;background:var(--s1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--b1);border-radius:var(--r);margin:0 20px 12px;overflow:hidden;cursor:pointer;transition:background .15s,transform .1s;min-height:110px}
    .city-card:active{background:var(--s2);transform:scale(.99)}
    .city-card-accent{width:3px;flex-shrink:0}
    .city-card-body{padding:18px 16px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
    .city-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .city-card-name{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--t1);line-height:1.1}
    .city-card-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:5px;border:1px solid;white-space:nowrap;margin-top:4px;flex-shrink:0}
    .city-card-dates{font-size:13px;color:var(--t2);margin-top:8px}
    .city-card-meta{font-size:11px;color:var(--t3);margin-top:5px;font-weight:500}
    .city-card-chevron{display:flex;align-items:center;justify-content:center;padding:0 14px;flex-shrink:0}

    /* CITY DETAIL */
    .city-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
    .city-detail-name{font-size:28px;font-weight:800;letter-spacing:-1.2px;color:var(--t1);line-height:1.1}
    .city-detail-date{font-size:13px;color:var(--t2);margin-top:4px}
    .notes-area{width:100%;background:rgba(255,255,255,0.02);border:1px solid var(--b1);border-radius:var(--r-sm);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.7;padding:12px 14px;resize:none;min-height:90px;outline:none;transition:border-color .15s;-webkit-appearance:none}
    .notes-area:focus{border-color:rgba(255,255,255,0.18)}
    .notes-area::placeholder{color:var(--t3)}
    .no-acts-txt{font-size:12px;color:var(--t3);padding:6px 0 2px}
    .add-act-section{margin-top:4px;display:flex;flex-direction:column;gap:8px}
    .btn-add-act{width:100%;padding:13px;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r-sm);color:var(--t1);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .15s}
    .btn-add-act:active{background:rgba(255,255,255,0.12)}
    .btn-del-city{width:100%;margin-top:24px;padding:13px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:var(--r-sm);color:#EF4444;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .15s}
    .btn-del-city:active{background:rgba(239,68,68,0.18)}

    /* MAP */
    #map{height:300px;width:100%}
    .leaflet-container{font-family:var(--font)!important;background:#06070F!important}
    .leaflet-popup-content-wrapper{background:rgba(10,11,28,.96)!important;border:1px solid var(--b2)!important;border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,.5)!important;color:var(--t1)!important}
    .leaflet-popup-tip{background:rgba(10,11,28,.96)!important}
    .stop-chip{display:flex;align-items:center;gap:13px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-sm);padding:13px 16px;margin:0 20px 8px}
    .stop-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .stop-chip-info{flex:1;min-width:0}
    .stop-chip-name{font-size:14px;font-weight:600;color:var(--t1)}
    .stop-chip-date{font-size:11px;color:var(--t2);margin-top:2px}
    .stop-chip-del{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex;align-items:center;flex-shrink:0}
    .stop-chip-del:active{color:var(--red)}

    /* CHECKLIST */
    .progress-track{height:2px;background:var(--b1);margin:4px 20px 0;border-radius:2px;position:relative;overflow:hidden}
    .progress-fill{position:absolute;top:0;left:0;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(212,168,83,.4)}
    .check-item{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-sm);padding:14px;margin:0 20px 7px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:opacity .25s}
    .check-item.done{opacity:.38}
    .check-circle{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--t3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .check-item.done .check-circle{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(74,222,128,.3)}
    .check-txt{flex:1;font-size:14px;color:var(--t1);min-width:0;line-height:1.4}
    .check-item.done .check-txt{text-decoration:line-through;color:var(--t2)}
    .check-del{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex;flex-shrink:0}
    .check-del:active{color:var(--red)}
    .act-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--b1)}
    .act-row:last-of-type{border-bottom:none}
    .act-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);min-width:58px;flex-shrink:0}
    .act-txt{flex:1;font-size:13px;color:var(--t1);min-width:0}
    .act-del{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex;flex-shrink:0}
    .act-del:active{color:var(--red)}

    /* EMPTY */
    .empty{text-align:center;padding:56px 24px;color:var(--t3)}
    .empty-icon{width:48px;height:48px;border-radius:12px;background:var(--s1);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .empty-title{font-size:15px;font-weight:600;color:var(--t2);margin-bottom:5px}
    .empty-desc{font-size:13px;line-height:1.6}

    /* MODALS */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:flex-end;justify-content:center}
    .overlay.open{display:flex}
    .sheet{background:rgba(10,11,28,.97);border:1px solid var(--b2);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:0 22px calc(24px + var(--safe-b));max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .sheet-lg{max-height:88vh}
    .sheet-handle{width:32px;height:3px;background:var(--b2);border-radius:2px;margin:12px auto 20px}
    .sheet-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:22px}
    .form-grp{margin-bottom:14px}
    .form-lbl{display:block;font-size:10px;font-weight:700;color:var(--t3);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .finput{width:100%;padding:13px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--b1);border-radius:var(--r-sm);font-size:16px;font-family:var(--font);color:var(--t1);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s}
    .finput:focus{border-color:var(--gold);background:rgba(212,168,83,.04)}
    .finput::placeholder{color:var(--t3)}
    select.finput{-webkit-appearance:none;appearance:none}
    .geo-hint{font-size:11px;color:var(--gold);margin-top:6px;min-height:14px}
    .btn-main{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#080918;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;margin-top:8px;box-shadow:0 4px 20px rgba(212,168,83,.25);transition:opacity .15s,transform .1s}
    .btn-main:active{opacity:.8;transform:scale(.98)}
    .btn-cancel{width:100%;padding:14px;background:none;border:none;font-size:15px;color:var(--t2);font-family:var(--font);cursor:pointer;margin-top:4px}
    .btn-cancel:active{opacity:.6}
  </style>
</head>
<body>
<div id="app">

  <!-- CITIES -->
  <div id="screen-cities" class="screen active">
    <div class="topbar">
      <div class="topbar-row">
        <h1>Tågluff 2026</h1>
        <div class="topbar-right">
          <div class="sync-pill syncing" id="sync-pill"><div class="sync-dot"></div><span id="sync-txt">Ansluter</span></div>
        </div>
      </div>
    </div>
    <div class="sec"><div class="sec-lbl">Städer</div><div class="sec-line"></div></div>
    <div id="cities-list"></div>
  </div>

  <!-- MAP -->
  <div id="screen-map" class="screen">
    <div class="topbar">
      <div class="topbar-row">
        <h1>Rutt</h1>
        <span id="map-count" style="font-size:12px;color:var(--t3);font-weight:500"></span>
      </div>
    </div>
    <div id="map"></div>
    <div class="sec"><div class="sec-lbl">Städer pa rutten</div><div class="sec-line"></div></div>
    <div id="stops-list"></div>
  </div>

  <!-- CHECKLIST -->
  <div id="screen-check" class="screen">
    <div class="topbar">
      <div class="topbar-row">
        <h1>Checklista</h1>
        <span id="check-count" style="font-size:12px;color:var(--t3);font-weight:500"></span>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="check-bar" style="width:0%"></div></div>
    <div id="checklist"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-cities" onclick="goTo('cities')">
      <div class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="3" width="16" height="13" rx="2"/><path d="M4 10h16"/>
          <circle cx="8.5" cy="19.5" r="1.5"/><circle cx="15.5" cy="19.5" r="1.5"/>
          <path d="M6 22l3-3M18 22l-3-3"/>
        </svg>
      </div>
      <span class="nav-lbl">Städer</span>
    </button>
    <button class="nav-btn" id="nav-map" onclick="goTo('map')">
      <div class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
      </div>
      <span class="nav-lbl">Karta</span>
    </button>
    <button class="nav-btn" id="nav-check" onclick="goTo('check')">
      <div class="nav-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 11 12 14 22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
      </div>
      <span class="nav-lbl">Lista</span>
    </button>
  </nav>
</div>

<button class="fab" id="fab" onclick="fabAction()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- MODAL: city detail -->
<div class="overlay" id="modal-city-detail">
  <div class="sheet sheet-lg">
    <div class="sheet-handle"></div>
    <div id="city-detail-content"></div>
  </div>
</div>

<!-- MODAL: add city -->
<div class="overlay" id="modal-add-city">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Lägg till stad</div>
    <div class="form-grp"><label class="form-lbl">Stad</label><input class="finput" id="in-city" placeholder="t.ex. Berlin" autocomplete="off" inputmode="text"/><div class="geo-hint" id="geo-hint"></div></div>
    <div class="form-grp"><label class="form-lbl">Datum</label><div class="form-row"><input class="finput" id="in-from" type="date" min="2026-08-02" max="2026-08-16"/><input class="finput" id="in-to" type="date" min="2026-08-02" max="2026-08-16"/></div></div>
    <button class="btn-main" id="city-add-btn" onclick="geocodeAndAdd()">Lägg till</button>
    <button class="btn-cancel" onclick="closeModal('modal-add-city')">Avbryt</button>
  </div>
</div>

<!-- MODAL: add checklist -->
<div class="overlay" id="modal-check">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Ny uppgift</div>
    <div class="form-grp"><label class="form-lbl">Uppgift</label><input class="finput" id="in-check" placeholder="t.ex. Köp Eurail-kort" autocomplete="off"/></div>
    <div class="form-grp"><label class="form-lbl">Kategori</label><select class="finput" id="in-cat"><option>Före resan</option><option>Packlista</option><option>Under resan</option></select></div>
    <button class="btn-main" onclick="addCheck()">Lägg till</button>
    <button class="btn-cancel" onclick="closeModal('modal-check')">Avbryt</button>
  </div>
</div>

  {c:'#D4A853',bg:'rgba(212,168,83,0.10)',bd:'rgba(212,168,83,0.24)'},
  {c:'#10B981',bg:'rgba(16,185,129,0.10)',bd:'rgba(16,185,129,0.24)'},
  {c:'#EF4444',bg:'rgba(239,68,68,0.10)',bd:'rgba(239,68,68,0.24)'},
  {c:'#8B5CF6',bg:'rgba(139,92,246,0.10)',bd:'rgba(139,92,246,0.24)'},
  {c:'#0EA5E9',bg:'rgba(14,165,233,0.10)',bd:'rgba(14,165,233,0.24)'},
  {c:'#F59E0B',bg:'rgba(245,158,11,0.10)',bd:'rgba(245,158,11,0.24)'},
];

const ACT_LABELS={boende:'Boende',mat:'Mat',aktivitet:'Aktivitet',transport:'Transport',
  'sevärdhet':'Sevärdhet',sevardhet:'Sevärdhet','nöje':'Nöje',noje:'Nöje',tips:'Tips'};

let state=null,mapInst=null,mapLayers=[],currentTab='cities',saveTimer=null,currentDetailStopId=null,notesTimer=null;

// OFFLINE-FIRST: render immediately from cache, sync Firebase in background
try { state=JSON.parse(localStorage.getItem('tg26')||'null')||JSON.parse(JSON.stringify(DEFAULTS)); }
catch(e){ state=JSON.parse(JSON.stringify(DEFAULTS)); }

function setSync(s){
  const p=document.getElementById('sync-pill'),t=document.getElementById('sync-txt');
  if(!p)return; p.className='sync-pill '+s;
  t.textContent=s==='online'?'Synkad':s==='offline'?'Offline':'Synkar';
}

// Connect Firebase — update state when data arrives
tripRef.onSnapshot(function(snap){
  state=snap.exists?snap.data():JSON.parse(JSON.stringify(DEFAULTS));
  if(!snap.exists)tripRef.set(DEFAULTS);
  setSync('online'); refreshTab(); updateCountdown();
}, function(err){
  setSync('offline');
  // Keep using the already-loaded local state
});

function save(){
  if(!state)return; setSync('syncing');
  try{localStorage.setItem('tg26',JSON.stringify(state));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    tripRef.set(state).then(function(){setSync('online');}).catch(function(){setSync('offline');});
  },500);
}

function goTo(tab){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  currentTab=tab;
  document.getElementById('fab').style.display='flex';
  if(tab==='map'){setTimeout(initMap,80);if(state)renderMap();}
  if(tab==='check'&&state)renderChecklist();
  if(tab==='cities'&&state)renderCities();
}

function fabAction(){
  if(currentTab==='cities'||currentTab==='map')openModal('modal-add-city');
  if(currentTab==='check')openModal('modal-check');
}

function refreshTab(){
  if(currentTab==='cities')renderCities();
  if(currentTab==='map'&&mapInst)renderMap();
  if(currentTab==='check')renderChecklist();
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});
});

/* ---- ACCENT HELPER ---- */
function getAccentIdx(stopId){
  const stops=state.stops||[]; let nh=0;
  for(var i=0;i<stops.length;i++){
    const s=stops[i]; const n=s.isHome?0:++nh;
    if(s.id===stopId)return{acc:ACCENTS[n===0?0:((n-1)%(ACCENTS.length-1))+1],n:n};
  }
  return{acc:ACCENTS[1],n:1};
}

/* ---- CITIES ---- */
function renderCities(){
  updateCountdown();
  if(!state)return;
  const el=document.getElementById('cities-list');
  const stops=state.stops||[];
  if(!stops.length){
    el.innerHTML=emptyH('Inga städer planerade','Tryck + för att lägga till din första stad');
    return;
  }
  let html='', nh=0;
  for(var i=0;i<stops.length;i++){
    const s=stops[i];
    const n=s.isHome?0:++nh;
    const acc=ACCENTS[n===0?0:((n-1)%(ACCENTS.length-1))+1];
    const actCount=(s.activities||[]).length;
    const actsText=actCount===0?'Inga aktiviteter':actCount+(actCount===1?' aktivitet':' aktiviteter');
    html+='<div class="city-card" data-id="'+s.id+'">'
      +'<div class="city-card-accent" style="background:'+acc.c+'"></div>'
      +'<div class="city-card-body">'
        +'<div class="city-card-top">'
          +'<div class="city-card-name">'+s.city+'</div>'
          +'<span class="city-card-badge" style="color:'+acc.c+';background:'+acc.bg+';border-color:'+acc.bd+'">'+(s.isHome?'START':'STOPP '+n)+'</span>'
        +'</div>'
        +'<div class="city-card-dates">'+fmtDate(s.from)+' — '+fmtDate(s.to)+'</div>'
        +'<div class="city-card-meta">'+actsText+'</div>'
      +'</div>'
      +'<div class="city-card-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>'
      +'</div>';
  }
  el.innerHTML=html;
}

function openCityDetail(id){
  currentDetailStopId=id;
  const stop=(state.stops||[]).find(function(s){return s.id===id;});
  if(!stop)return;
  buildDetailContent(stop);
  openModal('modal-city-detail');
}

function buildDetailContent(stop){
  const info=getAccentIdx(stop.id);
  const acc=info.acc, n=info.n;
  const acts=stop.activities||[];
  let actsHtml=acts.length===0
    ?'<div class="no-acts-txt">Inga aktiviteter tillagda</div>'
    :'';
  for(var i=0;i<acts.length;i++){
    const a=acts[i];
    actsHtml+='<div class="act-row">'
      +'<span class="act-tag">'+(ACT_LABELS[a.type]||a.type)+'</span>'
      +'<span class="act-txt">'+a.text+'</span>'
      +'<button class="act-del" data-id="'+a.id+'">'+xSVG(12)+'</button>'
      +'</div>';
  }
  document.getElementById('city-detail-content').innerHTML=
    '<div class="city-detail-header">'
      +'<div>'
        +'<div class="city-detail-name">'+stop.city+'</div>'
        +'<div class="city-detail-date">'+fmtDate(stop.from)+' — '+fmtDate(stop.to)+'</div>'
      +'</div>'
      +'<span class="city-card-badge" style="color:'+acc.c+';background:'+acc.bg+';border-color:'+acc.bd+'">'+(stop.isHome?'START':'STOPP '+n)+'</span>'
    +'</div>'
    +'<div class="sec" style="margin:20px 0 10px"><div class="sec-lbl">Anteckningar</div><div class="sec-line"></div></div>'
    +'<textarea class="notes-area" id="detail-notes" placeholder="Tips, adresser, bokningsnummer...">'+(stop.notes||'')+'</textarea>'
    +'<div class="sec" style="margin:20px 0 10px"><div class="sec-lbl">Aktiviteter</div><div class="sec-line"></div></div>'
    +'<div id="detail-acts-list">'+actsHtml+'</div>'
    +'<div class="sec" style="margin:20px 0 10px"><div class="sec-lbl">Lägg till aktivitet</div><div class="sec-line"></div></div>'
    +'<div class="add-act-section">'
      +'<select class="finput" id="detail-act-type">'
        +'<option value="boende">Boende</option>'
        +'<option value="mat">Mat &amp; dryck</option>'
        +'<option value="aktivitet">Aktivitet</option>'
        +'<option value="transport">Transport</option>'
        +'<option value="sevardhet">Sevärdhet</option>'
        +'<option value="noje">Nöje</option>'
        +'<option value="tips">Tips</option>'
      +'</select>'
      +'<input class="finput" id="detail-act-text" placeholder="Beskrivning..." style="margin-top:0"/>'
      +'<button class="btn-add-act" id="btn-add-act">Lägg till</button>'
    +'</div>'
    +(stop.isHome?'':'<button class="btn-del-city" id="btn-del-city">Ta bort stad</button>');

  // Notes: save on blur
  document.getElementById('detail-notes').addEventListener('input',function(){
    const val=this.value;
    clearTimeout(notesTimer);
    notesTimer=setTimeout(function(){
      const s=(state.stops||[]).find(function(x){return x.id===currentDetailStopId;});
      if(s){s.notes=val;save();}
    },1500);
  });
}

function refreshDetailActsList(){
  const stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
  if(!stop)return;
  const acts=stop.activities||[];
  const el=document.getElementById('detail-acts-list');
  if(!el)return;
  if(!acts.length){el.innerHTML='<div class="no-acts-txt">Inga aktiviteter tillagda</div>';return;}
  let html='';
  for(var i=0;i<acts.length;i++){
    const a=acts[i];
    html+='<div class="act-row">'
      +'<span class="act-tag">'+(ACT_LABELS[a.type]||a.type)+'</span>'
      +'<span class="act-txt">'+a.text+'</span>'
      +'<button class="act-del" data-id="'+a.id+'">'+xSVG(12)+'</button>'
      +'</div>';
  }
  el.innerHTML=html;
}

function addActFromDetail(){
  const textEl=document.getElementById('detail-act-text');
  const text=textEl?textEl.value.trim():'';
  const typeEl=document.getElementById('detail-act-type');
  const type=typeEl?typeEl.value:'boende';
  if(!text)return;
  const stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
  if(stop){
    if(!stop.activities)stop.activities=[];
    stop.activities.push({id:Date.now().toString(),text:text,type:type});
    save();
    if(textEl)textEl.value='';
    refreshDetailActsList();
    renderCities();
  }
}

function deleteActFromDetail(actId){
  const stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
  if(stop){
    stop.activities=(stop.activities||[]).filter(function(a){return a.id!==actId;});
    save(); refreshDetailActsList(); renderCities();
  }
}

/* ---- ADD CITY ---- */
async function geocodeAndAdd(){
  const city=document.getElementById('in-city').value.trim();
  const from=document.getElementById('in-from').value;
  const to=document.getElementById('in-to').value;
  if(!city){document.getElementById('geo-hint').textContent='Ange en stad.';return;}
  const btn=document.getElementById('city-add-btn');
  btn.textContent='Söker…'; btn.disabled=true;
  document.getElementById('geo-hint').textContent='Söker koordinater…';
  let lat=null,lng=null;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(city)+'&format=json&limit=1');
    const d=await r.json();
    if(d.length){lat=parseFloat(d[0].lat);lng=parseFloat(d[0].lon);}
    document.getElementById('geo-hint').textContent=lat?'Hittad.':'Hittades inte.';
  }catch(e){document.getElementById('geo-hint').textContent='Offline.';}
  if(!state.stops)state.stops=[];
  state.stops.push({id:Date.now().toString(),city:city,from:from,to:to,lat:lat,lng:lng,activities:[],notes:''});
  save(); btn.textContent='Lägg till'; btn.disabled=false;
  setTimeout(function(){
    closeModal('modal-add-city');
    ['in-city','in-from','in-to'].forEach(function(id){document.getElementById(id).value='';});
    document.getElementById('geo-hint').textContent='';
    renderCities(); if(mapInst)renderMap();
  },400);
}

function removeStop(id){
  state.stops=(state.stops||[]).filter(function(s){return s.id!==id;});
  save(); renderCities(); if(mapInst)renderMap();
}

/* ---- MAP ---- */
function initMap(){
  if(mapInst){mapInst.invalidateSize();return;}
  mapInst=L.map('map',{zoomControl:false,attributionControl:false}).setView([52,15],4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(mapInst);
}

function renderMap(){
  if(!mapInst||!state)return;
  mapLayers.forEach(function(m){try{mapInst.removeLayer(m);}catch(e){}});
  mapLayers=[];
  function mkPin(col){
    return L.divIcon({
      html:'<div style="width:11px;height:11px;border-radius:50%;background:'+col+';border:2px solid rgba(255,255,255,0.15);box-shadow:0 0 0 3px '+col+'30,0 2px 8px rgba(0,0,0,.4)"></div>',
      className:'',iconSize:[11,11],iconAnchor:[5.5,5.5]
    });
  }
  const coords=[];
  const stops=state.stops||[];
  stops.forEach(function(s){
    if(s.lat==null)return;
    const col=s.isHome?'#6366F1':'#D4A853';
    const m=L.marker([s.lat,s.lng],{icon:mkPin(col)}).addTo(mapInst)
      .bindPopup('<strong>'+s.city+'</strong><br><small>'+fmtDate(s.from)+' — '+fmtDate(s.to)+'</small>');
    mapLayers.push(m); coords.push([s.lat,s.lng]);
  });
  if(coords.length>1){
    const line=L.polyline(coords,{color:'#D4A853',weight:2,dashArray:'5 9',opacity:.55}).addTo(mapInst);
    mapLayers.push(line); mapInst.fitBounds(line.getBounds(),{padding:[32,32]});
  }
  const cEl=document.getElementById('map-count');
  if(cEl)cEl.textContent=stops.length+' stopp';
  const el=document.getElementById('stops-list');
  if(!stops.length){
    el.innerHTML=emptyH('Inga städer','Tryck + för att lägga till en stad');
    return;
  }
  let nh=0, html='';
  stops.forEach(function(s){
    const n=s.isHome?0:++nh;
    const acc=ACCENTS[n===0?0:((n-1)%(ACCENTS.length-1))+1];
    html+='<div class="stop-chip">'
      +'<div class="stop-chip-dot" style="background:'+acc.c+';box-shadow:0 0 6px '+acc.bg+'"></div>'
      +'<div class="stop-chip-info"><div class="stop-chip-name">'+s.city+'</div><div class="stop-chip-date">'+fmtDate(s.from)+' — '+fmtDate(s.to)+'</div></div>'
      +(s.isHome?'':'<button class="stop-chip-del" data-id="'+s.id+'">'+xSVG(13)+'</button>')
      +'</div>';
  });
  el.innerHTML=html;
}

/* ---- CHECKLIST ---- */
function renderChecklist(){
  if(!state)return;
  const cl=state.checklist||[], done=cl.filter(function(i){return i.done;}).length, total=cl.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('check-count').textContent=done+' / '+total;
  document.getElementById('check-bar').style.width=pct+'%';
  const el=document.getElementById('checklist');
  if(!total){el.innerHTML=emptyH('Listan är tom','Tryck + för att lägga till en uppgift');return;}
  const cats=[...new Set(cl.map(function(i){return i.cat;}))];
  let html='';
  cats.forEach(function(cat){
    html+='<div class="sec"><div class="sec-lbl">'+cat+'</div><div class="sec-line"></div></div>';
    cl.filter(function(i){return i.cat===cat;}).forEach(function(item){
      html+='<div class="check-item'+(item.done?' done':'')+'" data-id="'+item.id+'">'
        +'<div class="check-circle">'+(item.done?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#080918" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'')+'</div>'
        +'<span class="check-txt">'+item.text+'</span>'
        +'<button class="check-del" data-id="'+item.id+'">'+xSVG(13)+'</button>'
        +'</div>';
    });
  });
  el.innerHTML=html;
}

function addCheck(){
  const text=document.getElementById('in-check').value.trim();
  const cat=document.getElementById('in-cat').value;
  if(!text)return; if(!state.checklist)state.checklist=[];
  state.checklist.push({id:Date.now().toString(),text:text,cat:cat,done:false});
  save(); closeModal('modal-check'); document.getElementById('in-check').value=''; renderChecklist();
}
function toggleCheck(id){
  const item=(state.checklist||[]).find(function(i){return i.id===id;});
  if(item){item.done=!item.done; save(); renderChecklist();}
}
function deleteCheck(id){
  state.checklist=(state.checklist||[]).filter(function(i){return i.id!==id;});
  save(); renderChecklist();
}

/* ---- UTILS ---- */
function fmtDate(str){
  if(!str)return '–';
  return new Date(str+'T12:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
}
function updateCountdown(){}
function xSVG(s){
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
}
function emptyH(t,d){
  return '<div class="empty"><div class="empty-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div class="empty-title">'+t+'</div><div class="empty-desc">'+d+'</div></div>';
}

/* ---- EVENT DELEGATION (no inline onclick in generated HTML) ---- */
document.getElementById('cities-list').addEventListener('click',function(e){
  var card=e.target.closest('.city-card');
  if(card)openCityDetail(card.getAttribute('data-id'));
});
document.getElementById('stops-list').addEventListener('click',function(e){
  var btn=e.target.closest('.stop-chip-del');
  if(btn)removeStop(btn.getAttribute('data-id'));
});
document.getElementById('modal-city-detail').addEventListener('click',function(e){
  var del=e.target.closest('.act-del');
  if(del){deleteActFromDetail(del.getAttribute('data-id'));return;}
  if(e.target.id==='btn-add-act'){addActFromDetail();return;}
  if(e.target.id==='btn-del-city'){removeStop(currentDetailStopId);closeModal('modal-city-detail');return;}
});
document.getElementById('checklist').addEventListener('click',function(e){
  var del=e.target.closest('.check-del');
  if(del){e.stopPropagation();deleteCheck(del.getAttribute('data-id'));return;}
  var item=e.target.closest('.check-item');
  if(item)toggleCheck(item.getAttribute('data-id'));
});

/* ---- BOOT ---- */
setSync('syncing');
refreshTab();
updateCountdown();
setInterval(updateCountdown,60000);
</script>
</body>
