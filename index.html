<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#080918"/>
  <title>Tågluff 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    :root{
      --bg:#080918;--s1:rgba(255,255,255,0.04);--s2:rgba(255,255,255,0.08);
      --b1:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.14);
      --t1:#F0F0FF;--t2:#7A7B9A;--t3:#3E3F5E;
      --gold:#D4A853;--gold-hi:#F0CC78;--gold-lo:#9A6E28;
      --gold-dim:rgba(212,168,83,0.10);--green:#4ADE80;--red:#F87171;
      --r:14px;--r-sm:9px;
      --font:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;
      --safe-t:env(safe-area-inset-top,44px);--safe-b:env(safe-area-inset-bottom,0px);
      --nav-h:calc(62px + var(--safe-b));
    }
    html,body{height:100%;width:100%;font-family:var(--font);background:var(--bg);color:var(--t1);overflow:hidden;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(212,168,83,0.14) 0%,transparent 65%);top:-140px;right:-120px;pointer-events:none;z-index:0;animation:orbA 14s ease-in-out infinite}
    body::after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.12) 0%,transparent 65%);bottom:80px;left:-80px;pointer-events:none;z-index:0;animation:orbB 18s ease-in-out infinite}
    @keyframes orbA{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(30px) scale(1.08)}}
    @keyframes orbB{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-24px) scale(1.06)}}
    #app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative;z-index:1}
    .screen{display:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--nav-h) + 20px)}
    .screen.active{display:block;animation:fadeUp .28s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .topbar{padding:calc(var(--safe-t) + 14px) 20px 14px;background:rgba(8,9,24,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--b1)}
    .topbar-row{display:flex;align-items:center;justify-content:space-between}
    .topbar h1{font-size:16px;font-weight:600;color:var(--t1);letter-spacing:-0.1px}
    .topbar-right{display:flex;align-items:center;gap:10px}
    .cd-badge{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:-0.3px}
    .sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--t3);padding:4px 9px;border-radius:20px;border:1px solid var(--b1);background:var(--s1)}
    .sync-dot{width:5px;height:5px;border-radius:50%;background:var(--t3);transition:background .3s}
    .sync-pill.online .sync-dot{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.5)}
    .sync-pill.offline .sync-dot{background:var(--red)}
    .sync-pill.syncing .sync-dot{background:var(--gold);animation:pulse 1s ease-in-out infinite}
    .sync-pill.online{color:#6EE7A0}.sync-pill.offline{color:var(--red)}.sync-pill.syncing{color:var(--gold)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(6,7,18,0.90);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid var(--b1);display:flex;padding:8px 0 calc(8px + var(--safe-b));z-index:100}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;background:none;border:none;cursor:pointer;transition:opacity .12s}
    .nav-btn:active{opacity:.5}
    .nav-icon{width:44px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .2s}
    .nav-btn.active .nav-icon{background:var(--gold-dim)}
    .nav-btn svg{stroke:var(--t3);transition:stroke .2s}
    .nav-btn.active svg{stroke:var(--gold)}
    .nav-lbl{font-size:10px;font-weight:500;color:var(--t3);font-family:var(--font);transition:color .2s;letter-spacing:.2px}
    .nav-btn.active .nav-lbl{color:var(--gold)}
    .fab{position:fixed;bottom:calc(var(--nav-h) + 16px);right:max(16px,calc((100vw - 430px)/2 + 16px));width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold-hi),var(--gold));border:none;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(212,168,83,.35);z-index:90;transition:transform .12s}
    .fab:active{transform:scale(.9)}
    .fab svg{stroke:#080918}
    .sec{margin:24px 20px 10px;display:flex;align-items:center;gap:12px}
    .sec-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:1.4px;white-space:nowrap}
    .sec-line{flex:1;height:1px;background:var(--b1)}

    /* CITY CARDS */
    .city-card{display:flex;background:var(--s1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--b1);border-radius:var(--r);margin:0 20px 12px;overflow:hidden;cursor:pointer;transition:background .15s,transform .1s;min-height:110px}
    .city-card:active{background:var(--s2);transform:scale(.99)}
    .city-card-accent{width:3px;flex-shrink:0}
    .city-card-body{padding:18px 16px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
    .city-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .city-card-name{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--t1);line-height:1.1}
    .city-card-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:3px 8px;border-radius:5px;border:1px solid;white-space:nowrap;margin-top:4px;flex-shrink:0}
    .city-card-dates{font-size:13px;color:var(--t2);margin-top:8px}
    .city-card-meta{font-size:11px;color:var(--t3);margin-top:5px;font-weight:500}
    .city-card-chevron{display:flex;align-items:center;justify-content:center;padding:0 14px;flex-shrink:0}

    /* CITY DETAIL */
    .city-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
    .city-detail-name{font-size:28px;font-weight:800;letter-spacing:-1.2px;color:var(--t1);line-height:1.1}
    .city-detail-date{font-size:13px;color:var(--t2);margin-top:4px}
    .notes-area{width:100%;background:rgba(255,255,255,0.02);border:1px solid var(--b1);border-radius:var(--r-sm);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.7;padding:12px 14px;resize:none;min-height:90px;outline:none;transition:border-color .15s;-webkit-appearance:none}
    .notes-area:focus{border-color:rgba(255,255,255,0.18)}
    .notes-area::placeholder{color:var(--t3)}
    .no-acts-txt{font-size:12px;color:var(--t3);padding:6px 0 2px}
    .add-act-section{margin-top:4px;display:flex;flex-direction:column;gap:8px}
    .btn-add-act{width:100%;padding:13px;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r-sm);color:var(--t1);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .15s}
    .btn-add-act:active{background:rgba(255,255,255,0.12)}
    .btn-del-city{width:100%;margin-top:24px;padding:13px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);border-radius:var(--r-sm);color:#EF4444;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .15s}
    .btn-del-city:active{background:rgba(239,68,68,0.18)}
    .img-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
    .img-thumb-wrap{position:relative;width:90px;height:90px;border-radius:10px;overflow:hidden}
    .img-thumb{width:100%;height:100%;object-fit:cover;display:block}
    .img-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.65);border:none;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0;line-height:1}
    .btn-add-img{display:flex;align-items:center;justify-content:center;width:100%;padding:11px;background:var(--s2);border:1.5px dashed var(--b2);border-radius:var(--r-sm);color:var(--t3);font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;margin-top:2px;transition:background .15s}
    .btn-add-img:active{background:rgba(255,255,255,0.08)}
    .img-uploading{font-size:12px;color:var(--t3);padding:4px 0}
    .btn-add-city-inline{width:100%;margin-top:10px;padding:15px;background:transparent;border:1.5px dashed rgba(255,255,255,0.1);border-radius:var(--r);color:var(--t3);font-size:14px;font-weight:500;font-family:var(--font);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
    .btn-add-city-inline:hover{border-color:rgba(255,255,255,0.22);color:var(--t2)}
    .btn-add-city-inline:active{background:rgba(255,255,255,0.05)}
    /* LIGHTBOX */
    #lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0}
    #lightbox.open{display:flex;animation:fadeIn .18s ease both}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    #lightbox-img{max-width:100%;max-height:100vh;object-fit:contain;touch-action:pinch-zoom;user-select:none}
    #lightbox-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;background:rgba(255,255,255,0.12);border:none;border-radius:50%;width:38px;height:38px;font-size:17px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1;backdrop-filter:blur(8px)}
    .date-edit-row{display:flex;gap:10px;margin:14px 0 4px}
    .date-edit-grp{flex:1;display:flex;flex-direction:column;gap:5px}
    .date-inp{color-scheme:dark}

    /* UPPTÄCK (TINDER) */
    #screen-discover{height:100vh;box-sizing:border-box;padding-bottom:calc(var(--nav-h) + 14px);overflow:hidden}
    #screen-discover.active{display:flex;flex-direction:column}
    .cat-bar{display:flex;gap:8px;overflow-x:auto;padding-top:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .cat-bar::-webkit-scrollbar{display:none}
    .cat-pill{padding:6px 13px;border-radius:20px;background:rgba(255,255,255,0.06);border:1px solid var(--b1);color:var(--t3);font-size:12px;font-weight:600;font-family:var(--font);white-space:nowrap;cursor:pointer;transition:all .18s}
    .cat-pill.active{background:var(--gold-dim);border-color:var(--gold);color:var(--gold)}
    .cat-pill:active{transform:scale(.96)}

    .tinder-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 20px 0;justify-content:space-between;min-height:0;box-sizing:border-box}
    #tinder-container{position:relative;width:100%;flex:1;max-height:430px;min-height:280px}
    .tinder-card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--s1);border:1px solid rgba(255,255,255,0.12);box-shadow:0 16px 40px rgba(0,0,0,0.6);touch-action:none;user-select:none;will-change:transform;transition:transform .3s ease,opacity .3s ease;display:flex;flex-direction:column;justify-content:flex-end}
    .tinder-card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
    .tinder-card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.1) 0%,rgba(6,7,18,0.4) 50%,rgba(6,7,18,0.95) 100%);z-index:1}
    .tinder-card-content{position:relative;z-index:2;padding:20px;display:flex;flex-direction:column;gap:6px}
    .tinder-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .t-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,0.14);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,0.18)}
    .t-tag.city{background:rgba(99,102,241,0.3);border-color:rgba(99,102,241,0.5);color:#A5B4FC}
    .t-tag.price{background:rgba(16,185,129,0.25);border-color:rgba(16,185,129,0.4);color:#6EE7B7}
    .tinder-card-title{font-size:24px;font-weight:800;color:#fff;letter-spacing:-0.5px;line-height:1.15;margin-top:2px}
    .tinder-card-desc{font-size:13px;color:rgba(255,255,255,0.8);line-height:1.45;font-weight:400}
    
    /* Swipe Stamps */
    .stamp{position:absolute;top:24px;padding:8px 18px;border-radius:14px;font-size:24px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;border:4px solid;opacity:0;z-index:20;transition:opacity .08s ease,transform .08s ease;backdrop-filter:blur(8px);pointer-events:none}
    .stamp.stamp-like{right:20px;color:#10B981;border-color:#10B981;background:rgba(16,185,129,0.25);box-shadow:0 0 24px rgba(16,185,129,0.5);transform:rotate(14deg) scale(0.9)}
    .stamp.stamp-pass{left:20px;color:#EF4444;border-color:#EF4444;background:rgba(239,68,68,0.25);box-shadow:0 0 24px rgba(239,68,68,0.5);transform:rotate(-14deg) scale(0.9)}

    .tinder-actions{display:flex;align-items:center;justify-content:center;gap:24px;padding:10px 0 8px;z-index:5;flex-shrink:0}
    .tinder-btn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}
    .tinder-btn:active{transform:scale(.88)}
    .tinder-btn.btn-pass:hover{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);box-shadow:0 0 16px rgba(239,68,68,0.25)}
    .tinder-btn.btn-like:hover{background:rgba(16,185,129,0.15);border-color:rgba(16,185,129,0.4);box-shadow:0 0 16px rgba(16,185,129,0.25)}
    .tinder-btn.btn-rewind{width:46px;height:46px}
    .tinder-btn.btn-rewind:hover{background:rgba(14,165,233,0.15);border-color:rgba(14,165,233,0.4)}

    .tinder-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;color:var(--t3)}
    .tinder-empty-title{font-size:18px;font-weight:700;color:var(--t1);margin-top:12px}
    .tinder-empty-desc{font-size:13px;color:var(--t3);margin-top:4px}
    .btn-reset-tinder{margin-top:16px;padding:10px 20px;border-radius:var(--r-sm);background:var(--s2);border:1px solid var(--b2);color:var(--gold);font-weight:600;font-size:13px;cursor:pointer}

    .tinder-toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(40px);background:rgba(16,185,129,0.92);backdrop-filter:blur(12px);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.5);opacity:0;transition:all .25s ease;z-index:200;pointer-events:none}
    .tinder-toast.show{transform:translateX(-50%) translateY(0);opacity:1}

    /* MAP */
    #map{height:300px;width:100%}
    .leaflet-container{font-family:var(--font)!important;background:#06070F!important}
    .leaflet-popup-content-wrapper{background:rgba(10,11,28,.96)!important;border:1px solid var(--b2)!important;border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,.5)!important;color:var(--t1)!important}
    .leaflet-popup-tip{background:rgba(10,11,28,.96)!important}
    .stop-chip{display:flex;align-items:center;gap:13px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-sm);padding:13px 16px;margin:0 20px 8px}
    .stop-chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .stop-chip-info{flex:1;min-width:0}
    .stop-chip-name{font-size:14px;font-weight:600;color:var(--t1)}
    .stop-chip-date{font-size:11px;color:var(--t2);margin-top:2px}
    .stop-chip-del{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex;align-items:center;flex-shrink:0}
    .stop-chip-del:active{color:var(--red)}

    /* CHECKLIST */
    .progress-track{height:2px;background:var(--b1);margin:4px 20px 0;border-radius:2px;position:relative;overflow:hidden}
    .progress-fill{position:absolute;top:0;left:0;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(212,168,83,.4)}
    .check-item{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--b1);border-radius:var(--r-sm);padding:14px;margin:0 20px 7px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:opacity .25s}
    .check-item.done{opacity:.38}
    .check-circle{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--t3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
    .check-item.done .check-circle{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(74,222,128,.3)}
    .check-txt{flex:1;font-size:14px;color:var(--t1);min-width:0;line-height:1.4}
    .check-item.done .check-txt{text-decoration:line-through;color:var(--t2)}
    .check-del{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex;flex-shrink:0}
    .check-del:active{color:var(--red)}
    .act-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--b1)}
    .act-row:last-of-type{border-bottom:none}
    .act-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);min-width:58px;flex-shrink:0}
    .act-txt{flex:1;font-size:13px;color:var(--t1);min-width:0}
    .act-del{background:none;border:none;color:var(--t3);cursor:pointer;padding:4px;display:flex;flex-shrink:0}
    .act-del:active{color:var(--red)}

    /* EMPTY */
    .empty{text-align:center;padding:56px 24px;color:var(--t3)}
    .empty-icon{width:48px;height:48px;border-radius:12px;background:var(--s1);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
    .empty-title{font-size:15px;font-weight:600;color:var(--t2);margin-bottom:5px}
    .empty-desc{font-size:13px;line-height:1.6}

    /* MODALS */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:none;align-items:flex-end;justify-content:center}
    .overlay.open{display:flex}
    .sheet{background:rgba(10,11,28,.97);border:1px solid var(--b2);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:0 22px calc(24px + var(--safe-b));max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .sheet-lg{max-height:88vh}
    .sheet-handle{width:32px;height:3px;background:var(--b2);border-radius:2px;margin:12px auto 20px}
    .sheet-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:22px}
    .form-grp{margin-bottom:14px}
    .form-lbl{display:block;font-size:10px;font-weight:700;color:var(--t3);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .finput{width:100%;padding:13px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--b1);border-radius:var(--r-sm);font-size:16px;font-family:var(--font);color:var(--t1);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s}
    .finput:focus{border-color:var(--gold);background:rgba(212,168,83,.04)}
    .finput::placeholder{color:var(--t3)}
    select.finput{-webkit-appearance:none;appearance:none}
    .geo-hint{font-size:11px;color:var(--gold);margin-top:6px;min-height:14px}

let state=null,mapInst=null,mapLayers=[],currentTab='cities',saveTimer=null,currentDetailStopId=null,notesTimer=null;

try{state=JSON.parse(localStorage.getItem('tg26')||'null')||JSON.parse(JSON.stringify(DEFAULTS));}
catch(e){state=JSON.parse(JSON.stringify(DEFAULTS));}

function setSync(s){
  const p=document.getElementById('sync-pill'),t=document.getElementById('sync-txt');
  if(!p)return; p.className='sync-pill '+s;
  t.textContent=s==='online'?'Synkad':s==='offline'?'Offline':'Synkar';
}

tripRef.onSnapshot(function(snap){
  state=snap.exists?snap.data():JSON.parse(JSON.stringify(DEFAULTS));
  if(!snap.exists)tripRef.set(DEFAULTS);
  setSync('online'); renderCities(); if(mapInst)renderMap();
},function(err){setSync('offline');});

function save(){
  if(!state)return; setSync('syncing');
  try{localStorage.setItem('tg26',JSON.stringify(state));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    tripRef.set(state).then(function(){setSync('online');}).catch(function(){setSync('offline');});
  },500);
}

function goTo(tab){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  currentTab=tab;
  if(tab==='map'){setTimeout(function(){initMap();if(state)renderMap();},80);}
  if(tab==='cities'&&state)renderCities();
  if(tab==='discover')initTinderQueue();
}
function refreshTab(){
  if(currentTab==='cities')renderCities();
  if(currentTab==='map'&&mapInst)renderMap();
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});
});

function getAccentIdx(stopId){
  const stops=state.stops||[]; let nh=0;
  for(var i=0;i<stops.length;i++){
    const s=stops[i]; const n=s.isHome?0:++nh;
    if(s.id===stopId)return{acc:ACCENTS[n===0?0:((n-1)%(ACCENTS.length-1))+1],n:n};
  }
  return{acc:ACCENTS[1],n:1};
}

/* ---- CITIES ---- */
function renderCities(){
  if(!state)return;
  const el=document.getElementById('cities-list');
  const stops=state.stops||[];
  if(!stops.length){el.innerHTML=emptyH('Inga st\u00e4der planerade','Tryck + f\u00f6r att l\u00e4gga till din f\u00f6rsta stad');return;}
  let html='',nh=0;
  for(var i=0;i<stops.length;i++){
    const s=stops[i];
    const n=s.isHome?0:++nh;
    const acc=ACCENTS[n===0?0:((n-1)%(ACCENTS.length-1))+1];
    const actCount=(s.activities||[]).length;
    const imgCount=s.imgCount||0;
    const parts=[];
    if(actCount)parts.push(actCount+(actCount===1?' aktivitet':' aktiviteter'));
    if(imgCount)parts.push(imgCount+(imgCount===1?' bild':' bilder'));
    const meta=parts.length?parts.join(' \u00b7 '):'Tryck f\u00f6r detaljer';
    html+='<div class="city-card" data-id="'+s.id+'">'
      +'<div class="city-card-accent" style="background:'+acc.c+'"></div>'
      +'<div class="city-card-body">'
        +'<div class="city-card-top">'
          +'<div class="city-card-name">'+s.city+'</div>'
          +'<span class="city-card-badge" style="color:'+acc.c+';background:'+acc.bg+';border-color:'+acc.bd+'">'+(s.isHome?'START':'STOPP '+n)+'</span>'
        +'</div>'
        +(s.isHome?'':'<div class="city-card-dates">'+fmtDate(s.from)+' \u2014 '+fmtDate(s.to)+'</div>')
        +'<div class="city-card-meta">'+meta+'</div>'
      +'</div>'
      +'<div class="city-card-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>'
      +'</div>';
  }
  el.innerHTML=html;
  var addBtn=document.createElement('button');
  addBtn.className='btn-add-city-inline'; addBtn.id='btn-add-city-inline';
  addBtn.textContent='+ Lägg till stad'; el.appendChild(addBtn);
}

function openCityDetail(id){
  currentDetailStopId=id;
  const stop=(state.stops||[]).find(function(s){return s.id===id;});
  if(!stop)return;
  buildDetailContent(stop);
  openModal('modal-city-detail');
  loadStopImages(id);
}

function buildDetailContent(stop){
  const info=getAccentIdx(stop.id);
  const acc=info.acc,n=info.n;
  const acts=stop.activities||[];
  let actsHtml=acts.length===0?'<div class="no-acts-txt">Inga aktiviteter tillagda</div>':'';
  for(var i=0;i<acts.length;i++){
    const a=acts[i];
    actsHtml+='<div class="act-row"><span class="act-tag">'+(ACT_LABELS[a.type]||a.type)+'</span><span class="act-txt">'+a.text+'</span><button class="act-del" data-id="'+a.id+'">'+xSVG(12)+'</button></div>';
  }
  document.getElementById('city-detail-content').innerHTML=
    '<div class="city-detail-header">'
      +'<div><div class="city-detail-name">'+stop.city+'</div>'+(stop.isHome?'':'<div class="city-detail-date">'+fmtDate(stop.from)+' \u2014 '+fmtDate(stop.to)+'</div>')+'</div>'
      +'<span class="city-card-badge" style="color:'+acc.c+';background:'+acc.bg+';border-color:'+acc.bd+'">'+(stop.isHome?'START':'STOPP '+n)+'</span>'
    +'</div>'
    +(stop.isHome?'':'<div class="date-edit-row"><div class="date-edit-grp"><label class="form-lbl">Ankomst</label><input type="date" class="finput date-inp" id="detail-from" value="'+(stop.from||'')+'"/></div><div class="date-edit-grp"><label class="form-lbl">Avresa</label><input type="date" class="finput date-inp" id="detail-to" value="'+(stop.to||'')+'"/></div></div>')
    +'<div class="sec" style="margin:20px 0 10px"><div class="sec-lbl">Anteckningar</div><div class="sec-line"></div></div>'
    +'<textarea class="notes-area" id="detail-notes" placeholder="Tips, adresser, bokningsnummer...">'+(stop.notes||'')+'</textarea>'
    +'<div class="sec" style="margin:20px 0 10px"><div class="sec-lbl">Bilder</div><div class="sec-line"></div></div>'
    +'<div id="detail-imgs"><div class="no-acts-txt">Laddar bilder...</div></div>'
    +'<label class="btn-add-img" for="img-inp">+ L\u00e4gg till bild</label>'
    +'<input type="file" id="img-inp" accept="image/*" style="display:none"/>'
    +'<div class="sec" style="margin:20px 0 10px"><div class="sec-lbl">Aktiviteter</div><div class="sec-line"></div></div>'
    +'<div id="detail-acts-list">'+actsHtml+'</div>'
    +'<div class="sec" style="margin:20px 0 10px"><div class="sec-lbl">L\u00e4gg till aktivitet</div><div class="sec-line"></div></div>'
    +'<div class="add-act-section">'
      +'<select class="finput" id="detail-act-type"><option value="boende">Boende</option><option value="mat">Mat &amp; dryck</option><option value="aktivitet">Aktivitet</option><option value="transport">Transport</option><option value="sevardhet">Sev\u00e4rdhet</option><option value="noje">N\u00f6je</option><option value="tips">Tips</option></select>'
      +'<input class="finput" id="detail-act-text" placeholder="Beskrivning..." style="margin-top:0"/>'
      +'<button class="btn-add-act" id="btn-add-act">L\u00e4gg till</button>'
    +'</div>'
    +(stop.isHome?'':'<button class="btn-del-city" id="btn-del-city">Ta bort stad</button>');

  // Notes listener
  document.getElementById('detail-notes').addEventListener('input',function(){
    const val=this.value;
    clearTimeout(notesTimer);
    notesTimer=setTimeout(function(){
      const s=(state.stops||[]).find(function(x){return x.id===currentDetailStopId;});
      if(s){s.notes=val;save();}
    },1500);
  });
  // Date listeners
  var fromEl=document.getElementById('detail-from'),toEl=document.getElementById('detail-to');
  function saveDates(){
    const s=(state.stops||[]).find(function(x){return x.id===currentDetailStopId;});
    if(!s)return;
    if(fromEl)s.from=fromEl.value;
    if(toEl)s.to=toEl.value;
    save(); renderCities();
  }
  if(fromEl)fromEl.addEventListener('change',saveDates);
  if(toEl)toEl.addEventListener('change',saveDates);
  // Image file listener
  var imgInp=document.getElementById('img-inp');
  if(imgInp)imgInp.addEventListener('change',function(){
    if(this.files&&this.files[0])uploadImage(this.files[0]);
    this.value='';
  });
}

/* ---- IMAGES (stored in Firestore images collection, compressed via Canvas) ---- */
function loadStopImages(stopId){
  const el=document.getElementById('detail-imgs');
  if(!el)return;
  imgsCol.where('stopId','==',stopId).get().then(function(snap){
    if(snap.empty){el.innerHTML='<div class="no-acts-txt">Inga bilder</div>';return;}
    let html='<div class="img-grid">';
    snap.forEach(function(doc){
      html+='<div class="img-thumb-wrap"><img class="img-thumb" src="'+doc.data().data+'"/><button class="img-del" data-imgid="'+doc.id+'">'+xSVG(11)+'</button></div>';
    });
    html+='</div>';
    el.innerHTML=html;
  }).catch(function(){el.innerHTML='<div class="no-acts-txt">Kunde inte ladda bilder</div>';});
}

function uploadImage(file){
  var el=document.getElementById('detail-imgs');
  if(el)el.innerHTML='<div class="img-uploading">Komprimerar och laddar upp...</div>';
  var imgEl=new Image();
  var objUrl=URL.createObjectURL(file);
  imgEl.onload=function(){
    var MAX=900,w=imgEl.width,h=imgEl.height;
    if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
    else if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
    var canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(imgEl,0,0,w,h);
    var data=canvas.toDataURL('image/jpeg',0.65);
    URL.revokeObjectURL(objUrl);
    imgsCol.add({stopId:currentDetailStopId,data:data,timestamp:Date.now()}).then(function(){
      var stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
      if(stop){stop.imgCount=(stop.imgCount||0)+1;save();}
      loadStopImages(currentDetailStopId);
    }).catch(function(err){
      if(el)el.innerHTML='<div class="no-acts-txt">Fel: '+err.message+'</div>';
    });
  };
  imgEl.onerror=function(){URL.revokeObjectURL(objUrl);};
  imgEl.src=objUrl;
}

function deleteImage(imgId){
  imgsCol.doc(imgId).delete().then(function(){
    var stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
    if(stop&&stop.imgCount>0){stop.imgCount--;save();}
    loadStopImages(currentDetailStopId);
  });
}

function refreshDetailActsList(){
  const stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
  if(!stop)return;
  const acts=stop.activities||[];
  const el=document.getElementById('detail-acts-list');
  if(!el)return;
  if(!acts.length){el.innerHTML='<div class="no-acts-txt">Inga aktiviteter tillagda</div>';return;}
  let html='';
  for(var i=0;i<acts.length;i++){
    const a=acts[i];
    html+='<div class="act-row"><span class="act-tag">'+(ACT_LABELS[a.type]||a.type)+'</span><span class="act-txt">'+a.text+'</span><button class="act-del" data-id="'+a.id+'">'+xSVG(12)+'</button></div>';
  }
  el.innerHTML=html;
}

function addActFromDetail(){
  const textEl=document.getElementById('detail-act-text');
  const text=textEl?textEl.value.trim():'';
  const typeEl=document.getElementById('detail-act-type');
  const type=typeEl?typeEl.value:'boende';
  if(!text)return;
  const stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
  if(stop){
    if(!stop.activities)stop.activities=[];
    stop.activities.push({id:Date.now().toString(),text:text,type:type});
    save(); if(textEl)textEl.value='';
    refreshDetailActsList(); renderCities();
  }
}

function deleteActFromDetail(actId){
  const stop=(state.stops||[]).find(function(s){return s.id===currentDetailStopId;});
  if(stop){
    stop.activities=(stop.activities||[]).filter(function(a){return a.id!==actId;});
    save(); refreshDetailActsList(); renderCities();
  }
}

/* ---- ADD CITY ---- */
async function geocodeAndAdd(){
  const city=document.getElementById('in-city').value.trim();
  const from=document.getElementById('in-from').value;
  const to=document.getElementById('in-to').value;
  if(!city){document.getElementById('geo-hint').textContent='Ange en stad.';return;}
  const btn=document.getElementById('city-add-btn');
  btn.textContent='S\u00f6ker\u2026';btn.disabled=true;
  document.getElementById('geo-hint').textContent='S\u00f6ker koordinater\u2026';
  let lat=null,lng=null;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(city)+'&format=json&limit=1');
    const d=await r.json();
    if(d.length){lat=parseFloat(d[0].lat);lng=parseFloat(d[0].lon);}
    document.getElementById('geo-hint').textContent=lat?'Hittad.':'Hittades inte.';
  }catch(e){document.getElementById('geo-hint').textContent='Offline.';}
  if(!state.stops)state.stops=[];
  state.stops.push({id:Date.now().toString(),city:city,from:from,to:to,lat:lat,lng:lng,activities:[],notes:'',imgCount:0});
  save();btn.textContent='L\u00e4gg till';btn.disabled=false;
  setTimeout(function(){
    closeModal('modal-add-city');
    ['in-city','in-from','in-to'].forEach(function(id){document.getElementById(id).value='';});
    document.getElementById('geo-hint').textContent='';
    renderCities();if(mapInst)renderMap();
  },400);
}

function removeStop(id){
  state.stops=(state.stops||[]).filter(function(s){return s.id!==id;});
  save();renderCities();if(mapInst)renderMap();
}

/* ---- MAP ---- */
function initMap(){
  if(mapInst){mapInst.invalidateSize();return;}
  mapInst=L.map('map',{zoomControl:false,attributionControl:false}).setView([52,15],4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(mapInst);
}

function renderMap(){
  if(!mapInst||!state)return;
  mapLayers.forEach(function(m){try{mapInst.removeLayer(m);}catch(e){}});mapLayers=[];
  function mkPin(col){return L.divIcon({html:'<div style="width:11px;height:11px;border-radius:50%;background:'+col+';border:2px solid rgba(255,255,255,0.15);box-shadow:0 0 0 3px '+col+'30,0 2px 8px rgba(0,0,0,.4)"></div>',className:'',iconSize:[11,11],iconAnchor:[5.5,5.5]});}
  const coords=[],stops=state.stops||[];
  stops.forEach(function(s){
    if(s.lat==null)return;
    const col=s.isHome?'#6366F1':'#D4A853';
    const m=L.marker([s.lat,s.lng],{icon:mkPin(col)}).addTo(mapInst).bindPopup('<strong>'+s.city+'</strong><br><small>'+fmtDate(s.from)+' \u2014 '+fmtDate(s.to)+'</small>');
    mapLayers.push(m);coords.push([s.lat,s.lng]);
  });
  if(coords.length>1){const line=L.polyline(coords,{color:'#D4A853',weight:2,dashArray:'5 9',opacity:.55}).addTo(mapInst);mapLayers.push(line);mapInst.fitBounds(line.getBounds(),{padding:[32,32]});}
  const cEl=document.getElementById('map-count');if(cEl)cEl.textContent=stops.length+' stopp';
  const el=document.getElementById('stops-list');
  if(!stops.length){el.innerHTML=emptyH('Inga st\u00e4der','Tryck + f\u00f6r att l\u00e4gga till en stad');return;}
  let nh=0,html='';
  stops.forEach(function(s){
    const n=s.isHome?0:++nh;
    const acc=ACCENTS[n===0?0:((n-1)%(ACCENTS.length-1))+1];
    html+='<div class="stop-chip"><div class="stop-chip-dot" style="background:'+acc.c+';box-shadow:0 0 6px '+acc.bg+'"></div><div class="stop-chip-info"><div class="stop-chip-name">'+s.city+'</div><div class="stop-chip-date">'+fmtDate(s.from)+' \u2014 '+fmtDate(s.to)+'</div></div>'+(s.isHome?'':'<button class="stop-chip-del" data-id="'+s.id+'">'+xSVG(13)+'</button>')+'</div>';
  });
  el.innerHTML=html;
}

function updateCountdown(){}
function xSVG(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';}

let activeCategory = 'all';
let spotQueue = [];
let historyStack = [];

function getFilteredSpots(){
  if(activeCategory==='all') return [...DISCOVER_SPOTS];
  return DISCOVER_SPOTS.filter(s => s.category === activeCategory);
}

function initTinderQueue(){
  spotQueue = getFilteredSpots();
  historyStack = [];
  renderTinderStack();
}

function renderTinderStack(){
  const container = document.getElementById('tinder-container');
  if(!container) return;
  
  if(spotQueue.length === 0){
    container.innerHTML = `
      <div class="tinder-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <div class="tinder-empty-title">Inga fler tips i denna kategori!</div>
        <div class="tinder-empty-desc">Du har kollat igenom alla tips här.</div>
        <button class="btn-reset-tinder" onclick="initTinderQueue()">Börja om</button>
      </div>
    `;
    return;
  }

  // Render top 3 cards in stack
  let html = '';
  const visible = spotQueue.slice(0, 3);
  
  for(let i = visible.length - 1; i >= 0; i--){
    const spot = visible[i];
    const isTop = (i === 0);
    const scale = 1 - (i * 0.04);
    const translateY = i * 12;
    const opacity = 1 - (i * 0.15);
    
    html += `
      <div class="tinder-card" id="${isTop ? 'top-card' : ''}" style="transform: translateY(${translateY}px) scale(${scale}); opacity: ${opacity}; z-index: ${10 - i}">
        <img class="tinder-card-img" src="${spot.img}" alt="${spot.title}" />
        <div class="tinder-card-overlay"></div>
        <div class="stamp stamp-like">SPARA ❤️</div>
        <div class="stamp stamp-pass">PASSA ✕</div>
        <div class="tinder-card-content">
          <div class="tinder-tags">
            <span class="t-tag city">📍 ${spot.city}</span>
            <span class="t-tag price">${spot.price}</span>
          </div>
          <div class="tinder-card-title">${spot.title}</div>
          <div class="tinder-card-desc">${spot.desc}</div>
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
  
  // Attach gestures to top card
  setupTopCardGestures();
}

function setupTopCardGestures(){
  const topCard = document.getElementById('top-card');
  if(!topCard) return;
  
  let startX = 0, startY = 0, currentX = 0, currentY = 0, isDragging = false;
  const stampLike = topCard.querySelector('.stamp-like');
  const stampPass = topCard.querySelector('.stamp-pass');

  function onPointerDown(e){
    isDragging = true;
    startX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
    topCard.style.transition = 'none';
  }

  function onPointerMove(e){
    if(!isDragging) return;
    const x = (e.clientX || (e.touches && e.touches[0].clientX) || 0) - startX;
    const y = (e.clientY || (e.touches && e.touches[0].clientY) || 0) - startY;
    currentX = x; currentY = y;

    const rotate = x * 0.08;
    topCard.style.transform = `translate(${x}px, ${y}px) rotate(${rotate}deg)`;

    // Opacity & glow effect of stamps and card border
    if(x > 15){
      const progress = Math.min(1, x / 60);
      if(stampLike){
        stampLike.style.opacity = progress;
        stampLike.style.transform = `rotate(14deg) scale(${0.9 + progress * 0.15})`;
      }
      if(stampPass) stampPass.style.opacity = '0';
      topCard.style.borderColor = `rgba(16,185,129,${Math.min(0.85, x / 70)})`;
      topCard.style.boxShadow = `0 16px 40px rgba(0,0,0,0.6), 0 0 ${Math.min(36, x / 2)}px rgba(16,185,129,0.5)`;
    } else if(x < -15){
      const progress = Math.min(1, Math.abs(x) / 60);
      if(stampPass){
        stampPass.style.opacity = progress;
        stampPass.style.transform = `rotate(-14deg) scale(${0.9 + progress * 0.15})`;
      }
      if(stampLike) stampLike.style.opacity = '0';
      topCard.style.borderColor = `rgba(239,68,68,${Math.min(0.85, Math.abs(x) / 70)})`;
      topCard.style.boxShadow = `0 16px 40px rgba(0,0,0,0.6), 0 0 ${Math.min(36, Math.abs(x) / 2)}px rgba(239,68,68,0.5)`;
    } else {
      if(stampLike) stampLike.style.opacity = '0';
      if(stampPass) stampPass.style.opacity = '0';
      topCard.style.borderColor = '';
      topCard.style.boxShadow = '';
    }
  }

  function onPointerUp(){
    if(!isDragging) return;
    isDragging = false;
    topCard.style.transition = 'transform 0.3s ease, opacity 0.3s ease, border-color 0.2s ease, box-shadow 0.2s ease';

    if(currentX > 110){
      triggerLike();
    } else if(currentX < -110){
      triggerPass();
    } else {
      topCard.style.transform = '';
      topCard.style.borderColor = '';
      topCard.style.boxShadow = '';
      if(stampLike) stampLike.style.opacity = '0';
      if(stampPass) stampPass.style.opacity = '0';
    }
    currentX = 0; currentY = 0;
  }

  topCard.addEventListener('mousedown', onPointerDown);
  topCard.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  topCard.addEventListener('touchstart', onPointerDown, {passive: true});
  topCard.addEventListener('touchmove', onPointerMove, {passive: true});
  topCard.addEventListener('touchend', onPointerUp);
}

function triggerLike(){
  if(!spotQueue.length) return;
  const spot = spotQueue.shift();
  historyStack.push(spot);
  
  const topCard = document.getElementById('top-card');
  if(topCard){
    topCard.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
    topCard.style.transform = 'translate(140%, 40px) rotate(30deg)';
    topCard.style.opacity = '0';
  }

  // Add activity to state
  saveSpotToItinerary(spot);

  setTimeout(renderTinderStack, 280);
}

function triggerPass(){
  if(!spotQueue.length) return;
  const spot = spotQueue.shift();
  historyStack.push(spot);

  const topCard = document.getElementById('top-card');
  if(topCard){
    topCard.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
    topCard.style.transform = 'translate(-140%, 40px) rotate(-30deg)';
    topCard.style.opacity = '0';
  }

  setTimeout(renderTinderStack, 280);
}

function triggerRewind(){
  if(!historyStack.length) return;
  const last = historyStack.pop();
  spotQueue.unshift(last);
  renderTinderStack();
}

function saveSpotToItinerary(spot){
  if(!state) return;
  if(!state.stops) state.stops = [];
  
  // Find matching city stop in state (case insensitive)
  let stop = state.stops.find(s => s.city.toLowerCase().trim() === spot.city.toLowerCase().trim());
  
  if(!stop){
    // Auto-create city stop if it doesn't exist!
    stop = {
      id: Date.now().toString(),
      city: spot.city,
      from: '',
      to: '',
      activities: [],
      notes: '',
      imgCount: 0
    };
    state.stops.push(stop);
  }

  if(!stop.activities) stop.activities = [];
  stop.activities.push({
    id: Date.now().toString(),
    text: spot.title + ' — ' + spot.desc,
    type: spot.actType || 'tips'
  });

  save();
  renderCities();
  showTinderToast(`Sparades i ${spot.city}! ❤️`);
}

function showTinderToast(msg){
  const toast = document.getElementById('tinder-toast');
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

/* Category filter listener */
document.addEventListener('click', function(e){
  if(e.target.classList.contains('cat-pill')){
    document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    e.target.classList.add('active');
    activeCategory = e.target.getAttribute('data-cat');
    initTinderQueue();
  }
});

/* Actions buttons listener */
document.addEventListener('click', function(e){
  if(e.target.closest('#btn-tinder-pass')) triggerPass();
  if(e.target.closest('#btn-tinder-like')) triggerLike();
  if(e.target.closest('#btn-tinder-rewind')) triggerRewind();
});

(function(){
  var overlay=document.getElementById('modal-city-detail');
  var sheet=overlay.querySelector('.sheet-lg');
  var startY=0,startScrollTop=0,dragging=false,lastDy=0;
  overlay.addEventListener('touchstart',function(e){
    if(!e.target.closest('.sheet-lg'))return;
    // Re-query in case content changed
    sheet=overlay.querySelector('.sheet-lg');
    startY=e.touches[0].clientY;
    startScrollTop=sheet?sheet.scrollTop:0;
    dragging=true; lastDy=0;
  },{passive:true});
  overlay.addEventListener('touchmove',function(e){
    if(!dragging||!sheet)return;
    var dy=e.touches[0].clientY-startY;
    lastDy=dy;
    // Only intercept downward swipe when sheet is scrolled to top
    if(dy>0&&startScrollTop<=0){
      e.preventDefault();
      sheet.style.transition='none';
      sheet.style.transform='translateY('+dy+'px)';
    }
  },{passive:false});
  overlay.addEventListener('touchend',function(){
    if(!dragging||!sheet)return;
    dragging=false;
    if(lastDy>0&&startScrollTop<=0){
      if(lastDy>110){
        sheet.style.transition='transform .26s cubic-bezier(.4,0,1,1)';
        sheet.style.transform='translateY(105%)';
        setTimeout(function(){overlay.classList.remove('open');sheet.style.cssText='';},270);
      } else {
        sheet.style.transition='transform .32s cubic-bezier(.34,1.56,.64,1)';
        sheet.style.transform='';
      }
    }
  },{passive:true});
})();
